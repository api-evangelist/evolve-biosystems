aid: evolve-biosystems
name: Infinant Health
description: 'Infinant Health (formerly Evolve Biosystems) is a privately held life-sciences
  company in Sacramento, California, spun out of the Foods for Health Institute at
  the University of California, Davis after more than a decade of research into the
  infant gut microbiome. Its foundational discovery is B. infantis EVC001, a strain
  of Bifidobacterium longum subsp. infantis that metabolizes human milk oligosaccharides
  and has largely disappeared from infants in industrialized countries. The company
  commercializes that strain as Evivo, a consumer infant probiotic sold direct-to-consumer
  and through retail, and is developing INF108 as a drug candidate intended to reduce
  necrotizing enterocolitis in premature infants. Infinant Health is a biotechnology
  and consumer-health manufacturer rather than a software company: it publishes clinical
  trials, peer-reviewed publications and investor material, but no developer program,
  public API, SDK or machine-readable API contract could be found on any of its hosts.'
